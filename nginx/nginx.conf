user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging config (Optional: tune format to exclude sensitive data if needed)
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Basic performance tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression (PRD §10: Optimize payload size over slow 3G/4G networks)
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Support large media uploads up to 500MB (PRD §10: 100MB free / 500MB premium)
    client_max_body_size 500M;

    # Buffering configurations to prevent slow clients from locking upstream connections
    client_body_buffer_size 128k;
    proxy_buffers 8 16k;
    proxy_buffer_size 32k;
    proxy_busy_buffers_size 64k;

    # Upstream services
    upstream web_upstream {
        server web:3000;
        keepalive 32; # Keep-alive connections to upstream to minimize handshakes
    }

    upstream api_upstream {
        server api-server:5000;
        keepalive 32;
    }

    # Gateway Server (Port 80 HTTP)
    # Note: In production, configure SSL on Port 443 with TLS and HSTS.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Security Headers (Next.js config sets some, but good to ensure via proxy)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=()" always;

        # Shared proxy settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 1. API route proxying (Direct to Fastify)
        location /api/v1/ {
            proxy_pass http://api_upstream;
            
            # Disable buffering for uploads/presigned responses to minimize latency
            proxy_request_buffering off;
            proxy_buffering off;
            
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # 2. Next.js Static Build Assets (Cached aggressively, immutable hash-based assets)
        location ~* ^/_next/static/.*$ {
            proxy_pass http://web_upstream;
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # 3. Public Static Assets (Logo, favicon, icons, images)
        location ~* ^/(favicon\.ico|favicon\.svg|compr-logo\.svg|images/|icons/|manifest\.json|robots\.txt|llms\.txt)$ {
            proxy_pass http://web_upstream;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
        }

        # 4. Job status page (PRD §22, security.md: Job pages must never be cached or indexed)
        location /jobs/ {
            proxy_pass http://web_upstream;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
        }

        # 5. Default location (All other paths direct to Next.js web application)
        location / {
            proxy_pass http://web_upstream;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        }
    }
}
