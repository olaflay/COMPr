<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="#075E54"/>
  
  <!-- Outer green N-shape brackets -->
  <!-- Top Left hook -->
  <path d="M 160 248 V 160 H 224 L 288 248" stroke="#25D366" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom Right hook -->
  <path d="M 352 264 V 352 H 288 L 224 264" stroke="#25D366" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Diagonal connection to close the 'N' -->
  <path d="M 224 160 L 288 352" stroke="#25D366" stroke-width="24" stroke-linecap="round"/>
  
  <!-- Inner white focus corner brackets -->
  <path d="M 196 224 V 196 H 224" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 316 224 V 196 H 288" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 196 288 V 316 H 224" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 316 288 V 316 H 288" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Central green circle / aperture lens -->
  <circle cx="256" cy="256" r="56" stroke="#25D366" stroke-width="20" fill="none"/>

  <!-- Central white focus crosshair -->
  <path d="M 216 256 H 296 M 256 216 V 296" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
</svg>
