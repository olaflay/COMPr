version: "3.9"

# NoBlur — Multi-service architecture for adaptive media engine.
# Usage:
#   docker compose up -d                  # Start all services
#   docker compose up -d postgres redis   # Start only infrastructure
#   docker compose up analysis-worker     # Start analysis workers only
#   docker compose scale analysis-worker=2  # Scale analysis workers

services:
  # ── Infrastructure ──────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-noblur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-noblur}
    ports:
      # Bound to localhost only (D-2): DB must not be reachable on the public
      # host interface in a production-like deployment. Internal services
      # reach it via the compose network (`postgres:5432`), which needs no
      # host mapping.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noblur}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      # Localhost-only binding (D-2) — see note on postgres above.
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Web Application & API Server ────────────────────────────────

  api-server:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-noblur}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-noblur}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - TIGRIS_ENDPOINT=${TIGRIS_ENDPOINT:-}
      - TIGRIS_REGION=${TIGRIS_REGION:-auto}
      - TIGRIS_ACCESS_KEY_ID=${TIGRIS_ACCESS_KEY_ID:-}
      - TIGRIS_SECRET_ACCESS_KEY=${TIGRIS_SECRET_ACCESS_KEY:-}
      - TIGRIS_UPLOADS_BUCKET=${TIGRIS_UPLOADS_BUCKET:-noblur-uploads}
      - TIGRIS_OUTPUTS_BUCKET=${TIGRIS_OUTPUTS_BUCKET:-noblur-outputs}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - POSTHOG_API_KEY=${POSTHOG_API_KEY:-}
      - NEXT_PUBLIC_APP_URL=http://localhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_APP_URL=http://localhost
      - NEXT_PUBLIC_POSTHOG_KEY=${NEXT_PUBLIC_POSTHOG_KEY:-}
      - NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
    depends_on:
      - api-server

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api-server

  # ── Workers ─────────────────────────────────────────────────────

  analysis-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-noblur}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-noblur}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - TIGRIS_ENDPOINT=${TIGRIS_ENDPOINT:-}
      - TIGRIS_REGION=${TIGRIS_REGION:-auto}
      - TIGRIS_ACCESS_KEY_ID=${TIGRIS_ACCESS_KEY_ID:-}
      - TIGRIS_SECRET_ACCESS_KEY=${TIGRIS_SECRET_ACCESS_KEY:-}
      - TIGRIS_UPLOADS_BUCKET=${TIGRIS_UPLOADS_BUCKET:-noblur-uploads}
      - TIGRIS_OUTPUTS_BUCKET=${TIGRIS_OUTPUTS_BUCKET:-noblur-outputs}
    command: ["node", "--experimental-strip-types", "workers/analysis-worker.ts"]
    volumes:
      - ./temp:/app/temp
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
      replicas: 2

  encode-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-noblur}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-noblur}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - TIGRIS_ENDPOINT=${TIGRIS_ENDPOINT:-}
      - TIGRIS_REGION=${TIGRIS_REGION:-auto}
      - TIGRIS_ACCESS_KEY_ID=${TIGRIS_ACCESS_KEY_ID:-}
      - TIGRIS_SECRET_ACCESS_KEY=${TIGRIS_SECRET_ACCESS_KEY:-}
      - TIGRIS_UPLOADS_BUCKET=${TIGRIS_UPLOADS_BUCKET:-noblur-uploads}
      - TIGRIS_OUTPUTS_BUCKET=${TIGRIS_OUTPUTS_BUCKET:-noblur-outputs}
      - VMAF_MODEL_PATH=/usr/share/model/vmaf_v0.6.1.json
    command: ["node", "--experimental-strip-types", "workers/encode-worker.ts"]
    volumes:
      - ./temp:/app/temp
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
      replicas: 1

  cleanup-cron:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-noblur}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-noblur}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - TIGRIS_ENDPOINT=${TIGRIS_ENDPOINT:-}
      - TIGRIS_REGION=${TIGRIS_REGION:-auto}
      - TIGRIS_ACCESS_KEY_ID=${TIGRIS_ACCESS_KEY_ID:-}
      - TIGRIS_SECRET_ACCESS_KEY=${TIGRIS_SECRET_ACCESS_KEY:-}
      - TIGRIS_UPLOADS_BUCKET=${TIGRIS_UPLOADS_BUCKET:-noblur-uploads}
      - RUN_CLEANUP_LOOP=true
    command: ["node", "--experimental-strip-types", "workers/cleanup-cron.ts"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:

